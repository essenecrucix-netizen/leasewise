# Alembic generic configuration.
#
# Run from backend/ directory after activating the venv:
#     cd backend && source .venv/bin/activate
#     uv run alembic upgrade head
#     uv run alembic revision --autogenerate -m "describe change"
#
# The async DB URL comes from app.core.config.settings.database_url at
# runtime — see alembic/env.py. We do not duplicate the URL here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Use a date-prefixed revision filename so migrations sort chronologically:
#   2026_05_04_1310-abcd1234_describe_change.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Don't print the URL on every run.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

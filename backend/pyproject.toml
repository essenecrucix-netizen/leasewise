[project]
name = "leasewise-backend"
version = "0.1.0"
description = "LeaseWise Canada — FastAPI backend"
authors = [{ name = "Erik Brisson" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "azure-identity>=1.19.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "geoalchemy2>=0.15.0",  # PostGIS support
    "apscheduler>=3.10.4",  # in-process job scheduling for LeaseHackr ingestion (CLAUDE.md approved Phase 1.4)
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",  # for TestClient
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"

# nginx.conf — reverse proxy on the Azure VM
#
# Cloudflare Tunnel terminates HTTPS and forwards plain HTTP to nginx on
# port 80. Nginx routes:
#   /api/*  →  FastAPI backend on port 8000
#   /*       →  Next.js frontend on port 3000
#
# All TLS happens at the Cloudflare edge. We don't manage certs on the VM.

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;

    # Pass real client IP from Cloudflare Tunnel
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Gzip the things that compress well
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Upstream definitions
    upstream backend  { server backend:8000;  }
    upstream frontend { server frontend:3000; }

    server {
        listen 80;
        server_name _;

        # Health probe — used by Cloudflare Tunnel
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # API routes go to FastAPI
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }

        # Backend OpenAPI docs (only if backend exposes them; production hides them)
        location = /docs        { return 404; }
        location = /redoc       { return 404; }
        location = /openapi.json{ return 404; }

        # Static assets from Next.js (cached aggressively)
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Everything else → Next.js
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }
    }
}

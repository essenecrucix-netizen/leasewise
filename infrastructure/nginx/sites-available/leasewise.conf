# /etc/nginx/sites-available/leasewise.conf
#
# LeaseWise vhost. Cloudflare Tunnel forwards traffic to this Nginx; Nginx
# routes /api/* to the FastAPI backend (port 8000) and everything else to
# the Next.js frontend (port 3000). Both backend and frontend run as
# systemd services on this host.
#
# Symlink into sites-enabled to activate:
#   sudo ln -s /etc/nginx/sites-available/leasewise.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream leasewise_backend  { server 127.0.0.1:8000; keepalive 16; }
upstream leasewise_frontend { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 80;
    server_name leasewise.ca www.leasewise.ca;

    # Real client IP from Cloudflare Tunnel
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Health probe (used by Cloudflare Tunnel)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Production: hide backend OpenAPI docs
    location = /docs        { return 404; }
    location = /redoc       { return 404; }
    location = /openapi.json{ return 404; }

    # Backend: /api/*
    location /api/ {
        proxy_pass http://leasewise_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Static Next.js assets (cache aggressively)
    location /_next/static/ {
        proxy_pass http://leasewise_frontend;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Frontend: everything else
    location / {
        proxy_pass http://leasewise_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}

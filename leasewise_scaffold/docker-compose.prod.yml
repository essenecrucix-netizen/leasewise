# docker-compose.prod.yml — production orchestration on the Azure VM
#
# Differences from dev:
#   - No bind mounts (image content is the artifact)
#   - Restart policies are unless-stopped
#   - No exposed Postgres port (Postgres runs as Azure managed service, not in compose)
#   - Cloudflare Tunnel sidecar handles inbound traffic
#   - Nginx terminates internal HTTP and proxies frontend + backend
#
# To deploy:
#   1. SSH to the VM
#   2. cd /opt/leasewise
#   3. git pull
#   4. docker compose -f docker-compose.prod.yml pull
#   5. docker compose -f docker-compose.prod.yml up -d
#
# That sequence is wrapped by scripts/deploy.sh.

services:
  backend:
    image: ghcr.io/erikbrisson/leasewise-backend:latest
    restart: unless-stopped
    environment:
      ENVIRONMENT:    production
      LOG_LEVEL:      INFO
      MOCK_AUTH:      "false"
    env_file:
      - /opt/leasewise/.env.prod
    expose:
      - "8000"

  frontend:
    image: ghcr.io/erikbrisson/leasewise-frontend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
    env_file:
      - /opt/leasewise/.env.prod
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "80"
    depends_on:
      - frontend
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - /opt/leasewise/.env.prod
    depends_on:
      - nginx
